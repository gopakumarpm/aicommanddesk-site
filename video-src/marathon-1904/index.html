<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Strangest Marathon Ever – stickman story</title>
<style>
  html,body{margin:0;background:#000}
  svg{display:block;width:1280px;height:720px}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// ======================= setup =======================
const V = !!window.VERTICAL; let CAPTAG = null;
if (V) { const el = document.getElementById('s'); el.setAttribute('viewBox', '0 0 720 1280'); el.style.width = '720px'; el.style.height = '1280px'; }
const W = 1280, H = 720, INK = '#1b1a18';
const FONT = '"DejaVu Sans","Inter",sans-serif', MONO = '"DejaVu Sans Mono",monospace';
const T = window.TIMINGS || { total: 98.22, lines: [0.6, 9.9, 16.7, 24.3, 33.4, 41.1, 47.3, 51.9, 54.6, 63.7, 73.6, 82.2, 87.2].map((s, i, a) => ({ start: s, end: (a[i + 1] || 96) - .5, text: 'line ' + i })) };
const L = T.lines;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const eo = p => 1 - Math.pow(1 - p, 3);
const sstep = (t, a, b) => eo(prog(t, a, b));
const rad = d => d * Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const f2 = n => Math.round(n * 100) / 100;

// scene start times; scene i runs from SC[i] to SC[i+1]
const SC = L.map((l, i) => i === 0 ? 0 : l.start - .3);
SC.push(T.total);
const sceneAt = t => { let i = 0; while (i < L.length - 1 && t >= SC[i + 1]) i++; return i; };

// ======================= svg primitives =======================
const tx = (x, y, s, o = {}) => {
  const { size = 30, fill = INK, anchor = 'middle', w = 700, op = 1, font = FONT, stroke = '', sw = 0, rot = 0, ls = 0 } = o;
  if (op <= 0 || s === '') return '';
  return `<text x="${f2(x)}" y="${f2(y)}" font-family='${font}' font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" opacity="${f2(op)}"${stroke ? ` stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke"` : ''}${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}${ls ? ` letter-spacing="${ls}"` : ''}>${esc(s)}</text>`;
};
const rect = (x, y, w, h, fill, o = {}) => { const { stroke = INK, sw = 3, r = 0, op = 1, rot = 0 } = o; return `<rect x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}" rx="${r}" fill="${fill}" stroke="${stroke || 'none'}" stroke-width="${sw}" opacity="${op}"${rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ''}/>`; };
const circ = (x, y, r, fill, o = {}) => { const { stroke = INK, sw = 3, op = 1 } = o; return `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" fill="${fill}" stroke="${stroke || 'none'}" stroke-width="${sw}" opacity="${op}"/>`; };
const ell = (x, y, rx, ry, fill, o = {}) => { const { stroke = INK, sw = 3, op = 1, rot = 0 } = o; return `<ellipse cx="${f2(x)}" cy="${f2(y)}" rx="${f2(rx)}" ry="${f2(ry)}" fill="${fill}" stroke="${stroke || 'none'}" stroke-width="${sw}" opacity="${op}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`; };
const path = (d, o = {}) => { const { fill = 'none', stroke = INK, sw = 3, op = 1, cap = 'round' } = o; return `<path d="${d}" fill="${fill}" stroke="${stroke || 'none'}" stroke-width="${sw}" stroke-linecap="${cap}" stroke-linejoin="round" opacity="${op}"/>`; };
const poly = (pts, fill, o = {}) => path('M' + pts.map(p => f2(p[0]) + ' ' + f2(p[1])).join(' L') + ' Z', { fill, ...o });
const grp = (s, tr, op = 1) => `<g transform="${tr}"${op < 1 ? ` opacity="${f2(op)}"` : ''}>${s}</g>`;

// ======================= stick figure =======================
const SKIN = '#f6f3ea', TANK = '#3b4560', SHORTS = '#eadfbf', SHOE = '#6a4326';
const seg = (a, ang, len) => [a[0] + len * Math.sin(rad(ang)), a[1] + len * Math.cos(rad(ang))];
function limb(pts, w, col, outline = INK) {
  const d = 'M' + pts.map(p => f2(p[0]) + ' ' + f2(p[1])).join(' L');
  return path(d, { stroke: outline, sw: w + 5 }) + path(d, { stroke: col, sw: w });
}
const POSE = { aUL: -9, aLL: -6, aUR: 9, aLR: 6, tL: -3, sL: -2, tR: 3, sR: 2, lean: 0, bob: 0 };
function poseStand(o = {}) { return { ...POSE, ...o }; }
function poseWalk(ph, o = {}) {
  const a = Math.sin(ph), b = Math.sin(ph + Math.PI);
  return { aUL: 30 * b - 6, aLL: 30 * b + 20, aUR: 30 * a + 6, aLR: 30 * a + 20, tL: 28 * a, sL: 28 * a - 12 * Math.max(0, -Math.cos(ph)), tR: 28 * b, sR: 28 * b - 12 * Math.max(0, Math.cos(ph)), lean: 3, bob: -2 * Math.abs(Math.cos(ph)), ...o };
}
function poseRun(ph, o = {}) {
  const a = Math.sin(ph), b = -a, ca = Math.cos(ph);
  const leg = (u, c) => ({ t: 38 * u + 4, s: 38 * u + 4 - 30 - 40 * Math.max(0, -c) - 10 * (1 - u) / 2 });
  const A = leg(a, ca), B = leg(b, -ca);
  return { aUL: 48 * b + 5, aLL: 48 * b + 85, aUR: 48 * a + 5, aLR: 48 * a + 85, tL: A.t, sL: A.s, tR: B.t, sR: B.s, lean: 12, bob: -9 * Math.abs(ca), ...o };
}
const MOUTH = {
  happy: s => path(`M${-15 * s} 0 Q0 ${13 * s} ${15 * s} 0`, { sw: 4 * s }),
  grin: s => path(`M${-17 * s} -2 Q0 ${24 * s} ${17 * s} -2 Z`, { fill: '#fff', sw: 3.5 * s }),
  sad: s => path(`M${-13 * s} ${8 * s} Q0 ${-6 * s} ${13 * s} ${8 * s}`, { sw: 4 * s }),
  smug: s => path(`M${-13 * s} ${3 * s} Q${4 * s} ${11 * s} ${15 * s} ${-3 * s}`, { sw: 4 * s }),
  worry: s => ell(0, 4 * s, 12 * s, 6 * s, INK, { stroke: INK, sw: 2, rot: -8 }),
  shock: s => ell(0, 6 * s, 9 * s, 13 * s, INK, { stroke: INK, sw: 2 }),
  sick: s => path(`M${-16 * s} ${4 * s} q${5 * s} ${-9 * s} ${10 * s} 0 t${10 * s} 0 t${10 * s} 0`, { sw: 4 * s }),
  flat: s => path(`M${-11 * s} ${4 * s} L${11 * s} ${4 * s}`, { sw: 4 * s }),
  o: s => ell(0, 5 * s, 6 * s, 7 * s, INK, { stroke: INK, sw: 2 }),
};
function face(cx, cy, s, mood, look, t, skin) {
  let o = '';
  const sleepy = mood === 'sleep', dizzy = mood === 'dizzy';
  const blink = (t * .9 % 3) < .09;
  const ex = [-17 * s, 17 * s];
  if (sleepy) ex.forEach(x => { o += path(`M${cx + x - 8 * s} ${cy - 2 * s} Q${cx + x} ${cy + 7 * s} ${cx + x + 8 * s} ${cy - 2 * s}`, { sw: 3.5 * s }); });
  else if (dizzy) ex.forEach(x => { let d = ''; for (let k = 0; k < 28; k++) { const a = k * .5 + t * 9, r = 1 + k * .38; d += (k ? 'L' : 'M') + f2(cx + x + Math.cos(a) * r * s) + ' ' + f2(cy - 2 * s + Math.sin(a) * r * s); } o += path(d, { sw: 2.2 * s }); });
  else ex.forEach(x => { o += ell(cx + x + look * 5 * s, cy - 2 * s, 6.2 * s, blink ? 1.4 * s : 10 * s, INK, { stroke: INK, sw: 1 }); });
  const m = { happy: 'a', sad: 'b', worry: 'b', shock: 'c', sick: 'b', sleep: 'd', dizzy: 'b' }[mood] || 'a';
  const br = (x1, y1, x2, y2, x3 = null) => path(`M${cx + x1 * s} ${cy + y1 * s} Q${cx + (x1 + x2) / 2 * s} ${cy + (Math.min(y1, y2) - 6) * s} ${cx + x2 * s} ${cy + y2 * s}`, { sw: 3.2 * s });
  if (!sleepy) {
    if (m === 'a') o += br(-27, -22, -8, -22) + br(8, -22, 27, -22);
    else if (m === 'b') o += path(`M${cx - 27 * s} ${cy - 16 * s} L${cx - 8 * s} ${cy - 25 * s}`, { sw: 3.2 * s }) + path(`M${cx + 27 * s} ${cy - 16 * s} L${cx + 8 * s} ${cy - 25 * s}`, { sw: 3.2 * s });
    else if (m === 'c') o += br(-27, -30, -8, -30) + br(8, -30, 27, -30);
  }
  const mt = mood === 'talk' ? `<ellipse cx="0" cy="${5 * s}" rx="${10 * s}" ry="${(2 + 8 * Math.abs(Math.sin(t * 11))) * s}" fill="${INK}"/>`
    : mood === 'eat' ? `<ellipse cx="0" cy="${6 * s}" rx="${(7 + 5 * Math.abs(Math.sin(t * 9))) * s}" ry="${(3 + 5 * Math.abs(Math.sin(t * 9))) * s}" fill="${INK}"/>`
    : mood === 'sleep' ? `<ellipse cx="0" cy="${8 * s}" rx="${4 * s}" ry="${(3 + 2 * Math.sin(t * 2.4)) * s}" fill="${INK}"/>`
    : (MOUTH[mood] || MOUTH.happy)(s);
  o += `<g transform="translate(${f2(cx + look * 4 * s)} ${f2(cy + 25 * s)})">${mt}</g>`;
  return o;
}
function man(x, gy, o = {}) {
  const { s = 1, dir = 1, mood = 'happy', look = 0, skin = SKIN, top = TANK, bottom = SHORTS, t = 0, trousers = '', hair = true, hat = '', rot = 0, shoes = true, sleeves = '', cap = '', name = '', holding = '' } = o;
  gy = Math.min(gy, 640);
  const p = { ...POSE, ...(o.pose || {}) };
  const hip = [x, gy - 104 * s + p.bob * s], sh = [x + p.lean * s, hip[1] - 92 * s], hc = [sh[0] + p.lean * .5 * s, sh[1] - 56 * s];
  const sL = [sh[0] - 27 * s, sh[1] + 10 * s], sR = [sh[0] + 27 * s, sh[1] + 10 * s];
  const hL = [x - 12 * s, hip[1]], hR = [x + 12 * s, hip[1]];
  const legPts = (h, ta, sa) => { const k = seg(h, ta, 52 * s); return [h, k, seg(k, sa, 52 * s)]; };
  const armPts = (a, ua, la) => { const e = seg(a, ua, 48 * s); return [a, e, seg(e, la, 46 * s)]; };
  const lL = legPts(hL, p.tL, p.sL), lR = legPts(hR, p.tR, p.sR), aL = armPts(sL, p.aUL, p.aLL), aR = armPts(sR, p.aUR, p.aLR);
  const legCol = trousers || skin, armCol = sleeves || skin;
  const leg = (pts) => {
    let g = limb(pts, (trousers ? 14 : 7) * s, legCol);
    if (!trousers) { const a = pts[1], b = pts[2], m = [lerp(a[0], b[0], .55), lerp(a[1], b[1], .55)]; g += limb([m, b], 8 * s, '#3b3b3b'); }
    if (shoes) { const f = pts[2]; g += ell(f[0] + 9 * s, f[1] + 3 * s, 19 * s, 9 * s, SHOE, { sw: 3 * s }); }
    return g;
  };
  let g = '';
  g += leg(lL) + leg(lR);
  if (!trousers) {
    [lL, lR].forEach(pts => { const e = [lerp(pts[0][0], pts[1][0], .75), lerp(pts[0][1], pts[1][1], .75)]; g += limb([pts[0], e], 24 * s, bottom); });
    g += poly([[hip[0] - 25 * s, hip[1] - 14 * s], [hip[0] + 25 * s, hip[1] - 14 * s], [hip[0] + 26 * s, hip[1] + 12 * s], [hip[0] - 26 * s, hip[1] + 12 * s]], bottom, { sw: 3.5 * s });
  }
  g += limb(aL, (sleeves ? 11 : 6.5) * s, armCol) + circ(aL[2][0], aL[2][1], 7.5 * s, skin, { sw: 3 * s });
  // torso (tank top)
  g += path(`M${f2(sh[0] - 8 * s)} ${f2(sh[1] - 12 * s)} L${f2(sh[0])} ${f2(sh[1] - 40 * s)}`, { sw: 0 });
  g += poly([[sh[0] - 30 * s, sh[1] + 4 * s], [sh[0] - 14 * s, sh[1] - 8 * s], [sh[0] + 14 * s, sh[1] - 8 * s], [sh[0] + 30 * s, sh[1] + 4 * s], [hip[0] + 24 * s, hip[1] - 8 * s], [hip[0] - 24 * s, hip[1] - 8 * s]], top, { sw: 3.5 * s });
  g += limb(aR, (sleeves ? 11 : 6.5) * s, armCol) + circ(aR[2][0], aR[2][1], 7.5 * s, skin, { sw: 3 * s });
  if (holding === 'scissors') g += grp(`<g stroke="${INK}" stroke-width="${3 * s}" fill="#ccc"><path d="M0 0 L${46 * s} ${-26 * s}" stroke-width="${6 * s}"/><path d="M0 ${4 * s} L${46 * s} ${30 * s}" stroke-width="${6 * s}"/><circle cx="${-8 * s}" cy="${-6 * s}" r="${8 * s}" fill="none"/><circle cx="${-8 * s}" cy="${12 * s}" r="${8 * s}" fill="none"/></g>`, `translate(${f2(aR[2][0])} ${f2(aR[2][1])})`);
  if (holding === 'bottle') g += grp(`${rect(-7 * s, -34 * s, 14 * s, 36 * s, '#7a4a22', { sw: 2.5 * s, r: 3 })}${rect(-4 * s, -46 * s, 8 * s, 14 * s, '#7a4a22', { sw: 2.5 * s })}${rect(-6 * s, -22 * s, 12 * s, 12 * s, '#f1e6c4', { sw: 1.5 * s })}`, `translate(${f2(aR[2][0])} ${f2(aR[2][1])})`);
  if (holding === 'pistol') g += grp(`${path(`M0 0 L${34 * s} ${-10 * s}`, { sw: 7 * s })}${path(`M0 0 L${-4 * s} ${14 * s}`, { sw: 7 * s })}`, `translate(${f2(aR[2][0])} ${f2(aR[2][1])})`);
  if (holding === 'apple') g += grp(`${circ(0, -8 * s, 10 * s, '#b4482f', { sw: 2.5 * s })}${path(`M0 ${-18 * s} q${3 * s} ${-8 * s} ${8 * s} ${-9 * s}`, { sw: 2.5 * s })}`, `translate(${f2(aR[2][0])} ${f2(aR[2][1])})`);
  // neck + head
  g += limb([[sh[0], sh[1] - 6 * s], [hc[0], hc[1] + 44 * s]], 6 * s, skin);
  g += circ(hc[0], hc[1], 50 * s, skin, { sw: 5 * s });
  if (hair) { const hx = hc[0], hy = hc[1]; g += [[-18, -46, -26, -62, -34, -66], [-4, -50, -6, -68, -16, -76], [10, -49, 14, -64, 24, -68], [-30, -38, -44, -48, -52, -46]].map(h => path(`M${f2(hx + h[0] * s)} ${f2(hy + h[1] * s)} Q${f2(hx + h[2] * s)} ${f2(hy + h[3] * s)} ${f2(hx + h[4] * s)} ${f2(hy + h[5] * s)}`, { sw: 3.5 * s })).join(''); }
  g += face(hc[0], hc[1], s, mood, look, t, skin);
  if (hat === 'bowler') g += ell(hc[0], hc[1] - 44 * s, 52 * s, 10 * s, '#2a2824', { sw: 3 * s }) + path(`M${f2(hc[0] - 32 * s)} ${f2(hc[1] - 46 * s)} Q${f2(hc[0])} ${f2(hc[1] - 100 * s)} ${f2(hc[0] + 32 * s)} ${f2(hc[1] - 46 * s)} Z`, { fill: '#2a2824', sw: 3 * s });
  if (hat === 'cap') g += path(`M${f2(hc[0] - 46 * s)} ${f2(hc[1] - 18 * s)} Q${f2(hc[0])} ${f2(hc[1] - 84 * s)} ${f2(hc[0] + 46 * s)} ${f2(hc[1] - 18 * s)} Z`, { fill: '#6b6a5a', sw: 3 * s }) + path(`M${f2(hc[0] + 12 * s)} ${f2(hc[1] - 24 * s)} L${f2(hc[0] + 58 * s)} ${f2(hc[1] - 20 * s)}`, { sw: 5 * s });
  if (hat === 'straw') g += ell(hc[0], hc[1] - 40 * s, 66 * s, 11 * s, '#d9c48a', { sw: 3 * s }) + path(`M${f2(hc[0] - 34 * s)} ${f2(hc[1] - 44 * s)} Q${f2(hc[0])} ${f2(hc[1] - 92 * s)} ${f2(hc[0] + 34 * s)} ${f2(hc[1] - 44 * s)} Z`, { fill: '#d9c48a', sw: 3 * s });
  if (hat === 'sunhat') g += ell(hc[0], hc[1] - 38 * s, 60 * s, 9 * s, '#c9b27a', { sw: 3 * s });
  if (rot) g = `<g transform="rotate(${rot} ${x} ${gy - 8})">${g}</g>`;
  if (dir < 0) g = `<g transform="translate(${2 * x} 0) scale(-1 1)">${g}</g>`;
  return g;
}
// small background figure (crowd / extra), greyed to sit behind
function extra(x, y, s, seed, o = {}) {
  const r = rng(seed), moods = ['happy', 'worry', 'grin', 'shock', 'flat'];
  const { cheer = 0, t = 0, col = ['#7a6a55', '#6b7a6a', '#8a7a8a', '#9a8a6a'][seed % 4], op = 1 } = o;
  const bob = cheer ? Math.abs(Math.sin(t * 6 + seed)) * 10 * s : 0;
  const hc = [x, y - 60 * s - bob];
  let g = path(`M${x} ${y - 38 * s - bob} L${x} ${y - bob}`, { sw: 5 * s });
  g += poly([[x - 18 * s, y - 38 * s - bob], [x + 18 * s, y - 38 * s - bob], [x + 14 * s, y - bob], [x - 14 * s, y - bob]], col, { sw: 3 * s });
  if (cheer) g += path(`M${x - 16 * s} ${y - 34 * s - bob} L${x - 30 * s} ${y - 66 * s - bob}`, { sw: 4 * s }) + path(`M${x + 16 * s} ${y - 34 * s - bob} L${x + 30 * s} ${y - 66 * s - bob}`, { sw: 4 * s });
  g += circ(hc[0], hc[1], 20 * s, '#e7e1d0', { sw: 3 * s });
  const m = cheer ? 'grin' : moods[Math.floor(r() * moods.length)];
  g += ell(x - 7 * s, hc[1] - 2 * s, 2.6 * s, 4 * s, INK, { sw: 0.5 }) + ell(x + 7 * s, hc[1] - 2 * s, 2.6 * s, 4 * s, INK, { sw: 0.5 });
  g += `<g transform="translate(${x} ${hc[1] + 10 * s})">${(MOUTH[m] || MOUTH.happy)(s * .45)}</g>`;
  return op < 1 ? `<g opacity="${op}">${g}</g>` : g;
}

// ======================= scenery =======================
const SKY = (t0 = 0, warm = 0) => `<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
function clouds(t, seed = 3) { const r = rng(seed); let g = ''; for (let i = 0; i < 4; i++) { const x = ((r() * 1500 + t * (4 + i * 2)) % 1500) - 110, y = 70 + r() * 150; g += `<g opacity=".55">${ell(x, y, 90, 20, '#f4ecd6', { stroke: '', sw: 0 })}${ell(x + 50, y - 14, 60, 18, '#f4ecd6', { stroke: '', sw: 0 })}${ell(x - 40, y + 6, 55, 14, '#f4ecd6', { stroke: '', sw: 0 })}</g>`; } return g; }
function hills(base = 340, seed = 5) { const r = rng(seed); let a = [[-20, base + 40]], b = []; for (let x = -20; x <= 1300; x += 90) a.push([x, base - 10 - r() * 50]); a.push([1300, base + 60], [-20, base + 60]); let g = poly(a, '#c6b78f', { sw: 3 }); b = [[-20, base + 60]]; for (let x = -20; x <= 1300; x += 70) b.push([x, base + 14 - r() * 28]); b.push([1300, base + 70]); return g + poly(b, '#bfae82', { sw: 3 }); }
function sun(x, y, r) { return `<g>${circ(x, y, r * 1.7, '#f6e3a8', { stroke: '', sw: 0, op: .35 })}${circ(x, y, r * 1.3, '#f6e3a8', { stroke: '', sw: 0, op: .45 })}${circ(x, y, r, '#fbf2cf', { stroke: INK, sw: 3 })}</g>`; }
function ground(y0 = 340, col = '#d2c093') { return `<rect x="-20" y="${y0}" width="1320" height="${H - y0 + 20}" fill="${col}"/>${path(`M-20 ${y0} L1300 ${y0}`, { sw: 3 })}`; }
function roadBG(scroll, o = {}) {
  const { hz = 330, shimmer = 0, t = 0 } = o;
  let g = SKY() + sun(1010, 150, 52) + clouds(t, 4) + hills(hz) + ground(hz);
  g += poly([[600, hz], [680, hz], [1120, H + 10], [160, H + 10]], '#dccb9f', { sw: 3.5 });
  const r = rng(11);
  for (let i = 0; i < 16; i++) { const z = ((i / 16) + scroll) % 1, y = hz + 4 + 386 * z * z, hw = 40 + 420 * z * z; for (const side of [-1, 1]) { const x = 640 + side * (hw + 30 + r() * 120 * z * z + 20); g += tuft(x, y, .25 + 1.5 * z * z); } }
  for (let k = -1; k <= 1; k += 2) { g += path(`M${640 + k * 14} ${hz + 6} L${640 + k * 200} ${H + 10}`, { sw: 2.4, op: .35 }); }
  if (shimmer) for (let i = 0; i < 6; i++) { const y = hz + 4 + i * 9, w = 220 + i * 70; g += path(`M${640 - w} ${y} q${w / 4} ${-6 + 6 * Math.sin(t * 3 + i)} ${w / 2} 0 t${w / 2} 0 t${w / 2} 0 t${w / 2} 0`, { sw: 2, op: .22 }); }
  return g;
}
function tuft(x, y, s = 1) { return path(`M${x - 8 * s} ${y} q${2 * s} ${-14 * s} ${-2 * s} ${-18 * s} M${x} ${y} q${0} ${-20 * s} ${3 * s} ${-24 * s} M${x + 8 * s} ${y} q${-2 * s} ${-12 * s} ${4 * s} ${-16 * s}`, { sw: 2.4 * Math.max(.7, s) }); }
function dust(x, y, t, s = 1, n = 5) { let g = ''; for (let i = 0; i < n; i++) { const k = ((t * .8 + i / n) % 1); g += circ(x - k * 170 * s - 10, y - 8 - k * 70 * s, (14 + k * 46) * s, '#e6d8b0', { stroke: '', sw: 0, op: .5 * (1 - k) }); } return g; }
function tree(x, y, s = 1, apples = true, o = {}) {

function scene1(t, lt, d) { // heat, dust, one water stop

  const lvl = sstep(lt, .4, 3.5);

function felixPortrait(t, x, gy, s, pose, mood, extra = {}) { return man(x, gy, { s, mood, pose, t, ...extra }); }

function scene3(t, lt, d) { // fundraising, gambling, hitchhiking
  const u = lt / d;
  let g = '';
  if (u < .36) { // run laps in Havana
    const sc = t * .35;
    g += SKY() + ground(470, '#cdb88a');
    for (let i = -1; i < 9; i++) { const x = ((i * 220 - sc * 700) % 1980 + 1980) % 1980 - 300; g += rect(x, 250, 170, 220, i % 2 ? '#d7c79e' : '#cdb98f', { sw: 3.5 }) + rect(x + 30, 290, 38, 70, '#9aa5a0', { sw: 3 }) + rect(x + 100, 290, 38, 70, '#9aa5a0', { sw: 3 }); }

    for (let i = 0; i < 5; i++) g += extra(110 + i * 60, 560, 1.0 - (i % 2) * .15, 70 + i, { cheer: 1, t });
    g += man(720, 640, { s: 1.15, pose: poseRun(t * 9), mood: 'grin', t, shoes: false });
    for (let k = 0; k < 7; k++) { const kk = ((lt * .9 + k * .31) % 1.2), px = 200 + k * 38 + kk * 350, py = 470 - Math.sin(Math.min(1, kk / 1.1) * Math.PI) * 190 + kk * 60; if (kk < 1.1) g += coin(px, py, 11); }

    g += man(1090, 660, { s: 1.3, hat: 'bowler', mood: 'smug', pose: poseStand({ aUL: -60, aLL: -80 }), dir: -1, t, top: '#5a3a3a' });
    const roll = prog(k, .0, .5), dx = 640 - lerp(160, 0, eo(roll)), dy = 400 - Math.abs(Math.sin(roll * 9)) * 90 * (1 - roll), rot = roll * 700;

  if (lt > gun && lt < gun + .5) { const k = prog(lt, gun, gun + .5); g += poly(Array.from({ length: 16 }, (_, i) => { const a = i / 16 * Math.PI * 2, r = (i % 2 ? 26 : 62) * (.4 + k); return [236 + 92 * k + Math.cos(a) * r, 520 - 10 * k + Math.sin(a) * r]; }), '#fbe28a', { sw: 3, op: 1 - k * .5 }); g += tx(330, 460, 'BANG!', { size: 66, font: MONO, w: 800, fill: '#8c3b2e', rot: -6, op: 1 - k * .6 }); }

function scene6(t, lt, d) { // apples
  const u = lt / d;
  let g = SKY() + clouds(t, 14) + hills(380, 31) + ground(430, '#cfbf8f');
  for (let i = 0; i < 6; i++) g += tuft(80 + i * 230, 700 + (i % 2) * 10, 1.6);

  const reach = prog(u, .05, .25), eat = prog(u, .28, .6), sick = prog(u, .55, .8);
  const skin = sick > 0 ? `rgb(${Math.round(lerp(246, 190, sick))},${Math.round(lerp(243, 214, sick))},${Math.round(lerp(234, 150, sick))})` : SKIN;
  const pose = u < .26 ? poseStand({ aUR: lerp(10, 165, reach), aLR: lerp(10, 170, reach) }) : poseStand({ aUR: 80 + Math.sin(t * 9) * (sick < .3 ? 14 : 0), aLR: 175 - Math.sin(t * 9) * (sick < .3 ? 12 : 0), lean: sick * 6 * 0 });
  g += man(500, 680, { s: 1.4, pose, mood: u < .26 ? 'happy' : sick > .3 ? 'sick' : 'eat', t, skin, shoes: false, holding: u > .26 && u < .6 ? 'apple' : '' });
  if (sick > .1) { for (let i = 0; i < 3; i++) g += path(`M${420 + i * 18} ${470 - (t * 20 % 10)} q10 -14 0 -26 q-10 -14 0 -26`, { sw: 3, stroke: '#7d9560', op: sick }); g += tx(500, 220, 'blurp...', { size: 40, font: MONO, w: 800, fill: '#5d7a42', op: sick, rot: -6 }); }
  g += stamp(900, 220, 'ROTTEN!', -8, '#8c3b2e', sstep(u, .6, .72), 66);
  return g;
}

function scene7(t, lt, d) { // nap

function scene8(t, lt, d) { // Lorz car + stadium

function scene10(t, lt, d) { // Len Tau & dogs

function scene11(t, lt, d) { // Felix wakes, runs, finishes 4th

    g += tx(640, 160, 'WAKE UP!', { size: 62, font: MONO, w: 800, fill: '#8c3b2e', op: sstep(wk, .4, .6), rot: -4 });
  } else {

function scene12(t, lt, d) { // moral
  const u = lt / d;
  let g = `<rect width="${W}" height="${H}" fill="url(#sky)"/>` + ground(520, '#cdb88a');
  g += man(900, 700, { s: 1.7, pose: poseStand({ aUR: 150 + Math.sin(t * 6) * 18, aLR: 160 + Math.sin(t * 6) * 14 }), mood: 'happy', t, shoes: false });

  items.forEach(([s, a], i) => g += tx(80, 150 + i * 80, s, { size: 54, font: MONO, w: 800, anchor: 'start', fill: '#5a4f3a', op: sstep(lt, a, a + .4) }));
  g += `<g opacity="${sstep(lt, 4.4, 4.9)}" transform="rotate(-3 300 400)">${rect(60, 380, 520, 100, '#f4ecd4', { sw: 5, r: 4 })}${tx(320, 450, '4TH PLACE', { size: 70, font: MONO, w: 800, fill: '#2f5a3a' })}</g>`;
  const e = sstep(lt, d - 4.8, d - 4.2);
  if (e > 0) g += `<g opacity="${e}"><rect width="${W}" height="${H}" fill="#cdb88a"/>${tx(640, 320, 'Never underestimate', { size: 58, font: MONO, w: 800 })}${tx(640, 392, 'someone who simply shows up.', { size: 58, font: MONO, w: 800, fill: '#8c3b2e' })}${tx(640, 520, 'AI Command Desk', { size: 34, font: MONO, w: 800, fill: '#5a4f3a' })}${tx(640, 560, 'aicommanddesk.com', { size: 24, font: MONO, w: 400, fill: '#5a4f3a' })}</g>`;
  return g;
}

const SCENES = [scene0, scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8, scene9, scene10, scene11, scene12];

// ======================= captions & film =======================
function captions(t) {
  const i = L.findIndex(l => t >= l.start - .05 && t <= l.end + .15);
  if (i < 0) return '';
  const l = L[i], words = l.text.replace(/[.,]/g, m => m).split(/\s+/);
  const chunks = []; for (let k = 0; k < words.length; k += 3) chunks.push(words.slice(k, k + 3).join(' '));
  const tot = chunks.reduce((a, c) => a + c.length, 0); let acc = 0, cur = chunks[chunks.length - 1];
  const p = (t - l.start) / (l.end - l.start);
  for (const c of chunks) { acc += c.length; if (p * tot <= acc) { cur = c; break; } }
  const txt = cur.toUpperCase().replace(/[.,]$/, '');
  if (V) return tx(360, 1130, txt, { size: Math.min(74, 640 / (txt.length * .78)), fill: '#fff', stroke: INK, sw: 12, w: 900, font: '"DejaVu Sans",sans-serif' });
  return tx(640, 694, txt, { size: 46, fill: '#fff', stroke: INK, sw: 9, w: 900, font: '"DejaVu Sans",sans-serif' });
}
function defs(t) {
  const seed = 1 + Math.floor(t * 8) % 9, gs = 1 + Math.floor(t * 24) % 50;
  return `<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdbf9b"/><stop offset=".6" stop-color="#e6dbbd"/><stop offset="1" stop-color="#efe6cc"/></linearGradient>
  <filter id="boil" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="${seed}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="${gs}" result="g"/><feColorMatrix type="matrix" values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .08  0 0 0 .9 -.25"/></filter>
  <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#2a2010" opacity=".13"/></pattern>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#1b1408" stop-opacity="0"/><stop offset="1" stop-color="#1b1408" stop-opacity=".62"/></radialGradient>
  </defs>`;
}
const FOCUS = [
  () => [640, 960], (u) => [lerp(560, 780, u), 820], () => [640, 780],
  (u) => u < .36 ? [580, 780] : u < .64 ? [640, 1020] : [640, 860],
  () => [620, 800],
  (u) => [lerp(640, 860, prog(u, .5, .65)), lerp(1000, 800, prog(u, .5, .65))],
  () => [660, 820], () => [640, 960], () => [640, 1040], (u) => u < .4 ? [640, 960] : [640, 860],
  (u) => [lerp(480, 640, u), 880], (u) => u < .45 ? [640, 780] : [740, 1040], () => [540, 1000],
];
function frameV(t) {
  const i = sceneAt(t), lt = t - SC[i], d = SC[i + 1] - SC[i], u = lt / d;
  CAPTAG = null;
  const [cx, vw] = FOCUS[i](u), sc = 720 / vw, hWin = H * sc, yWin = 640 - hWin / 2;
  const body = SCENES[i](t, lt, d);
  let o = defs(t) + `<rect width="720" height="1280" fill="#2a2113"/>`;
  o += `<clipPath id="win"><rect x="0" y="${f2(yWin)}" width="720" height="${f2(hWin)}"/></clipPath>`;
  o += `<g clip-path="url(#win)"><g filter="url(#boil)"><g transform="translate(0 ${f2(yWin)}) scale(${f2(sc)}) translate(${f2(-(cx - vw / 2))} 0)">${body}</g></g></g>`;
  o += rect(0, yWin - 4, 720, 8, INK, { sw: 0 }) + rect(0, yWin + hWin - 4, 720, 8, INK, { sw: 0 });
  // header
  o += tx(360, 92, 'THE STRANGEST', { size: 58, fill: '#f4ecd4', font: MONO, w: 800 }) + tx(360, 156, 'MARATHON EVER', { size: 58, fill: '#e6b07a', font: MONO, w: 800 });
  o += tx(360, 200, 'A TRUE OLYMPIC STORY · 1904', { size: 24, fill: '#bfae85', font: MONO, w: 700, ls: 2 });
  if (CAPTAG && CAPTAG.op > 0) o += `<g opacity="${f2(CAPTAG.op)}">${rect(150, yWin - 78, 420, 64, '#f4ecd4', { sw: 3, r: 4 })}${tx(360, yWin - 50, CAPTAG.a, { size: 24, font: MONO, w: 800 })}${tx(360, yWin - 26, CAPTAG.b, { size: 18, font: MONO, w: 500, fill: '#5a4f3a' })}</g>`;
  o += `<rect width="720" height="1280" fill="url(#sl)"/><rect width="720" height="1280" filter="url(#grain)" opacity=".4"/><rect width="720" height="1280" fill="url(#vig)"/>`;
  if (!(i === 12 && lt > d - 4.8)) o += captions(t);
  o += tx(360, 1236, 'AI COMMAND DESK', { size: 26, fill: '#bfae85', font: MONO, w: 800, ls: 3 });
  if (i > 0 && lt < .22) o += `<rect width="720" height="1280" fill="#1b1408" opacity="${f2(1 - lt / .22)}"/>`;
  if (t < .5) o += `<rect width="720" height="1280" fill="#1b1408" opacity="${f2(1 - t / .5)}"/>`;
  if (t > T.total - .8) o += `<rect width="720" height="1280" fill="#1b1408" opacity="${f2(1 - (T.total - t) / .8)}"/>`;
  return o;
}
function frame(t) {
  if (V) return frameV(t);
  const i = sceneAt(t), lt = t - SC[i], d = SC[i + 1] - SC[i];
  const zoom = 1 + .045 * (lt / d), pan = (lt / d - .5) * -14 * (i % 2 ? 1 : -1);
  let o = defs(t) + `<rect width="${W}" height="${H}" fill="#e6dbbd"/>`;
  o += `<g filter="url(#boil)"><g transform="translate(${f2(640 + pan)} 360) scale(${f2(zoom)}) translate(-640 -360)">${SCENES[i](t, lt, d)}</g></g>`;
  o += `<rect width="${W}" height="${H}" fill="url(#sl)"/><rect width="${W}" height="${H}" filter="url(#grain)" opacity=".5"/><rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  o += `<rect width="${W}" height="${H}" fill="#fff" opacity="${(.02 + .02 * Math.sin(t * 61)).toFixed(3)}"/>`;
  if (i < 12 || lt < d - 4.8) o += captions(t);
  const edge = Math.min(lt, d - lt), fadeA = 1 - clamp(edge / .22);
  if (i > 0 && lt < .22) o += `<rect width="${W}" height="${H}" fill="#1b1408" opacity="${f2(1 - lt / .22)}"/>`;
  if (t < .5) o += `<rect width="${W}" height="${H}" fill="#1b1408" opacity="${f2(1 - t / .5)}"/>`;
  if (t > T.total - .8) o += `<rect width="${W}" height="${H}" fill="#1b1408" opacity="${f2(1 - (T.total - t) / .8)}"/>`;
  o += `<rect x="0" y="0" width="${W}" height="10" fill="#111"/><rect x="0" y="${H - 10}" width="${W}" height="10" fill="#111"/>`;
  return o;
}
function render(t) { document.getElementById('s').innerHTML = frame(t); }
window.render = render; window.DURATION = T.total;
render(+(new URLSearchParams(location.search).get('t') || 0));
